<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness Trainer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            margin: 0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .stats-card {
            display: flex;
            gap: 32px;
            background: #1e293b;
            padding: 16px 32px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-val {
            font-size: 2.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .video-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background: #000;
        }

        video {
            display: block;
            width: 640px;
            max-width: 90vw;
            height: 480px;
            object-fit: cover;
            transform: scaleX(-1);
            /* Mirror camera for natural view */
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .start-btn {
            background: #22c55e;
            color: #000;
        }

        .stop-btn {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>🏋️ AI Bicep Curl Trainer</h1>

    <div class="stats-card">
        <div class="stat">
            <div class="stat-val" id="repCounter">0</div>
            <div>Reps</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="angleDisplay">--°</div>
            <div>Elbow Angle</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stateDisplay">ready</div>
            <div>Stage</div>
        </div>
    </div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button class="start-btn" id="startBtn" onclick="startCamera()">Start Camera</button>
        <button class="stop-btn" id="stopBtn" onclick="stopCamera()">Stop Camera</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const repCounter = document.getElementById('repCounter');
        const angleDisplay = document.getElementById('angleDisplay');
        const stateDisplay = document.getElementById('stateDisplay');

        let stream = null;
        let captureInterval = null;
        let isProcessing = false;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                await video.play();

                canvas.width = 640;
                canvas.height = 480;

                // Process frames at 5 FPS to keep Render CPU responsive
                captureInterval = setInterval(sendFrame, 200);
            } catch (err) {
                alert("Camera access denied or unavailable: " + err.message);
            }
        }

        function stopCamera() {
            if (captureInterval) clearInterval(captureInterval);
            if (stream) stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }

        async function sendFrame() {
            if (isProcessing || video.videoWidth === 0) return;
            isProcessing = true;

            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataURL = canvas.toDataURL('image/jpeg', 0.6);

                const res = await fetch('/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataURL })
                });

                if (res.ok) {
                    const data = await res.json();
                    repCounter.innerText = data.reps;
                    if (data.angle !== undefined) angleDisplay.innerText = data.angle + "°";
                    if (data.stage) stateDisplay.innerText = data.stage;
                }
            } catch (e) {
                console.error("Frame upload failed:", e);
            } finally {
                isProcessing = false;
            }
        }
    </script>
</body>

</html>
