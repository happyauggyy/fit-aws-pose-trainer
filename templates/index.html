<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Trainer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏋️ Fitness Trainer</h1>
            <p>AI-powered exercise tracking and feedback</p>
            <nav class="nav-links">
                <a href="/video_analysis" class="nav-link">🎬 Video Analysis</a>
                <a href="/dashboard" class="nav-link">📊 Dashboard</a>
            </nav>
        </header>
        
        <div class="main-content">
            <div class="video-container">
                <div id="video-placeholder" class="video-placeholder">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">📹</div>
                        <p id="camera-status-text">Click to start camera</p>
                        <button id="start-camera-btn" class="btn primary-btn">Start Camera</button>
                    </div>
                </div>
                <!-- Local Webcam Video Feed (Hidden source for frame capture) -->
                <video id="video" autoplay playsinline muted style="display: none;"></video>
                <!-- Invisible canvas for capturing frames into base64 -->
                <canvas id="capture-canvas" style="display: none;"></canvas>
                <!-- Processed image displaying AI keypoint overlay from Flask -->
                <img id="processed-feed" alt="Processed Video Feed with Keypoints" style="display: none; width: 100%; height: auto; object-fit: cover;">
            </div>
            
            <div class="controls">
                <div class="exercise-selection">
                    <h2>Select Exercise <span id="exercise-count" class="exercise-count"></span></h2>
                    
                    <!-- Exercise Category Tabs -->
                    <div class="category-tabs">
                        <button class="category-tab active" data-category="all">All</button>
                        <button class="category-tab" data-category="upper">Upper Body</button>
                        <button class="category-tab" data-category="lower">Lower Body</button>
                        <button class="category-tab" data-category="cardio">Cardio</button>
                    </div>
                    
                    <!-- Exercise Grid - Dynamically Loaded -->
                    <div class="exercise-options" id="exercise-grid">
                        <div class="loading">Loading exercises...</div>
                    </div>
                    
                    <!-- Exercise Info Panel -->
                    <div id="exercise-info" class="exercise-info hidden">
                        <div class="info-header">
                            <span id="info-name" class="info-name"></span>
                            <span id="info-type" class="info-type"></span>
                        </div>
                        <p id="info-description" class="info-description"></p>
                        <div id="info-note" class="info-note"></div>
                    </div>
                </div>
                
                <div class="exercise-config">
                    <h2>Configure Workout</h2>
                    <div class="config-inputs">
                        <div class="input-group">
                            <label for="sets">Sets:</label>
                            <input type="number" id="sets" min="1" max="10" value="3">
                        </div>
                        <div class="input-group">
                            <label for="reps">Repetitions:</label>
                            <input type="number" id="reps" min="1" max="30" value="10">
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button id="start-btn" class="btn primary-btn">Start Workout</button>
                    <button id="stop-btn" class="btn secondary-btn" disabled>Stop Workout</button>
                </div>
                
                <div class="workout-status">
                    <h2>Current Status</h2>
                    <h2 id="rep-count" class="live-reps-counter" style="color: #3498db; font-size: 1.8rem; margin: 10px 0;">Reps: 0</h2>
                    <div class="status-display">
                        <div class="status-item">
                            <span class="status-label">Exercise:</span>
                            <span id="current-exercise" class="status-value">None</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Set:</span>
                            <span id="current-set" class="status-value">0 / 0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Repetitions:</span>
                            <span id="current-reps" class="status-value">0 / 0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Form Score:</span>
                            <span id="form-score" class="status-value form-score">--</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Grade:</span>
                            <span id="form-grade" class="status-value form-grade">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <!-- Client-side HTML5 Camera Capture and Frame Processing Loop for Render -->
    <script>
        (function() {
            const video = document.getElementById('video') || document.querySelector('video');
            const canvas = document.getElementById('capture-canvas') || document.querySelector('canvas') || document.createElement('canvas');
            const processedFeed = document.getElementById('processed-feed') || document.querySelector('.video-container img') || document.querySelector('img');
            const repCountElem = document.getElementById('rep-count');
            const startCameraBtn = document.getElementById('start-camera-btn');
            const placeholder = document.getElementById('video-placeholder');
            const statusText = document.getElementById('camera-status-text');

            let localMediaStream = null;
            let isStreaming = false;
            let isProcessing = false;
            let captureIntervalId = null;

            async function captureAndSendFrame() {
                if (!isStreaming || isProcessing) return;
                if (!video || video.paused || video.ended) return;
                if (video.videoWidth === 0 || video.videoHeight === 0) return;

                isProcessing = true;
                try {
                    // Draw video frame to invisible canvas
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // Convert to JPEG base64 string
                    const base64Data = canvas.toDataURL('image/jpeg', 0.65);

                    // Send POST request to /process_frame (with fallback to /video_feed)
                    let response;
                    try {
                        response = await fetch('/process_frame', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image: base64Data })
                        });
                        if (!response.ok && response.status === 404) {
                            response = await fetch('/video_feed', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: base64Data })
                            });
                        }
                    } catch (netErr) {
                        response = await fetch('/video_feed', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image: base64Data })
                        });
                    }

                    if (response && response.ok) {
                        const data = await response.json();

                        // Display the processed image response with keypoints overlaid on <img> tag
                        const imgSource = data.image || data.processed_image || data.frame;
                        if (imgSource && processedFeed) {
                            processedFeed.src = imgSource.startsWith('data:') ? imgSource : `data:image/jpeg;base64,${imgSource}`;
                            processedFeed.style.display = 'block';
                            if (placeholder) {
                                placeholder.style.display = 'none';
                            }
                        }

                        // Update live Reps text on screen using the JSON response from Flask
                        const reps = data.reps !== undefined ? data.reps : (data.rep_count !== undefined ? data.rep_count : 0);
                        if (repCountElem) {
                            repCountElem.textContent = `Reps: ${reps}`;
                        }

                        // Also update current reps in status display if available
                        const currentRepsElem = document.getElementById('current-reps');
                        if (currentRepsElem && currentRepsElem.textContent.includes('/')) {
                            const parts = currentRepsElem.textContent.split('/');
                            currentRepsElem.textContent = `${reps} /${parts[1]}`;
                        }

                        // Update form score and grade if available in response
                        if (data.form_score !== undefined) {
                            const formScoreElem = document.getElementById('form-score');
                            if (formScoreElem) formScoreElem.textContent = Math.round(data.form_score);
                        }
                        if (data.form_grade !== undefined) {
                            const formGradeElem = document.getElementById('form-grade');
                            if (formGradeElem) formGradeElem.textContent = data.form_grade;
                        }
                    }
                } catch (err) {
                    console.warn('Frame processing loop warning:', err);
                } finally {
                    isProcessing = false;
                }
            }

            async function startCamera() {
                if (isStreaming) return;

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    const msg = 'Camera API is not supported by your browser or requires HTTPS. When hosted on Render, please access via https://';
                    console.error(msg);
                    if (statusText) {
                        statusText.textContent = msg;
                        statusText.style.color = '#ff6b6b';
                    }
                    alert(msg);
                    return;
                }

                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: false
                };

                try {
                    console.log('Starting camera and capturing webcam stream...');
                    if (statusText) {
                        statusText.textContent = 'Requesting camera permissions...';
                    }

                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    localMediaStream = stream;

                    if (video) {
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play().catch(e => console.warn('Autoplay error:', e));
                        };
                        video.onplaying = () => {
                            isStreaming = true;
                            if (placeholder) {
                                placeholder.style.display = 'none';
                            }
                            if (!captureIntervalId) {
                                captureIntervalId = setInterval(captureAndSendFrame, 65); // ~15 FPS
                            }
                            console.log('Continuous frame processing loop active and streaming.');
                        };
                    }
                } catch (err) {
                    console.error('Camera access error:', err);
                    let userMsg = 'Could not access the camera. ';
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        userMsg += 'Camera permission was denied. Please allow camera permissions in your browser settings or address bar.';
                    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                        userMsg += 'No camera found. Please connect a webcam.';
                    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                        userMsg += 'Camera is currently in use by another application.';
                    } else if (window.isSecureContext === false) {
                        userMsg += 'Camera permissions require a secure HTTPS connection. Please ensure your Render URL begins with https://';
                    } else {
                        userMsg += err.message || err.name;
                    }

                    if (statusText) {
                        statusText.textContent = userMsg;
                        statusText.style.color = '#ff6b6b';
                    }
                    alert(userMsg);
                }
            }

            function stopCamera() {
                isStreaming = false;
                if (captureIntervalId) {
                    clearInterval(captureIntervalId);
                    captureIntervalId = null;
                }
                if (localMediaStream) {
                    localMediaStream.getTracks().forEach(track => track.stop());
                    localMediaStream = null;
                }
                if (video) {
                    video.srcObject = null;
                    video.style.display = 'none';
                }
                if (processedFeed) {
                    processedFeed.src = '';
                    processedFeed.style.display = 'none';
                }
                if (placeholder) {
                    placeholder.style.display = 'flex';
                }
                fetch('/stop_camera', { method: 'POST' }).catch(() => {});
            }

            // Bind click event to Start Camera button
            if (startCameraBtn) {
                startCameraBtn.addEventListener('click', startCamera);
            }

            // Expose globally so external scripts or buttons can invoke
            window.startWebcamFeed = startCamera;
            window.stopWebcamFeed = stopCamera;

            // Stop webcam tracks on page exit
            window.addEventListener('beforeunload', stopCamera);
        })();
    </script>
</body>
</html>
